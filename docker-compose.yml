services:
  zumbido05:
    build: .
    container_name: zumbido-05
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    environment:
      APP_ENV: production
      PORT: 8000
      DATABASE_URL: ${DATABASE_URL:-sqlite:////app/data/zumbido05.db}
      JWT_SECRET: ${JWT_SECRET:-cambia-esta-clave-en-produccion}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
    volumes:
      - ./data:/app/data
